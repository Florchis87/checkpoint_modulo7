{% extends 'posts/base.html' %}

{% block content %}

<h1>Publicaciones</h1>

{% for post in posts %}

    <section>
        <h2>{{ post.titulo }}</h2>

        <p>{{ post.contenido }}</p>

        <p>
            <strong>Autor:</strong> {{ post.autor }}
        </p>

        <p>
            <strong>Fecha:</strong> {{ post.fecha_creacion }}
        </p>
    </section>

{% endfor %}

{% endblock %}
