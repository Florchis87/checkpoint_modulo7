{% extends 'posts/base.html' %}

{% block content %}

<h1>Publicaciones</h1>

<p>
    <a href="{% url 'crear_post' %}">
        Crear nueva publicación
    </a>
</p>

{% for post in posts %}

    <section>
        <h2>
            <a href="{% url 'detalle_post' post.id %}">
                {{ post.titulo }}
             </a>
        </h2>

        <p>{{ post.contenido }}</p>

        <p>
            <strong>Autor:</strong> {{ post.autor }}
        </p>

        <p>
            <strong>Fecha:</strong> {{ post.fecha_creacion }}
        </p>
    </section>

{% endfor %}

{% endblock %}
