{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Blog</title>

    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>

<body>

    <header>
        <nav>
            <a href="/">Inicio</a>
            <a href="/acerca/">Acerca de</a>
            <a href="{% url 'lista_posts' %}">Publicaciones</a>

            {% if user.is_authenticated %}
                <a href="{% url 'crear_post' %}">Crear publicación</a>
                <a href="{% url 'perfil' %}">Mi perfil</a>

                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Cerrar sesión</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
                <a href="{% url 'registro' %}">Registrarse</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
