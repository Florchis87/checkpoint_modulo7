{% extends 'posts/base.html' %}

{% block content %}

<h1>{{ post.titulo }}</h1>

<p>{{ post.contenido }}</p>

<p>
    <strong>Autor:</strong> {{ post.autor }}
</p>

<p>
    <strong>Estado:</strong> {{ post.get_estado_display }}
</p>

{% if post.imagen %}
    <img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" width="500">
{% else %}
    <p>Este post no tiene imagen.</p>
{% endif %}

<div class="acciones-post"></div>
    <a href="{% url 'editar_post' post.id %}">
        Editar publicación ✍🏻
    </a>

    <a href="{% url 'eliminar_post' post.id %}">
        Eliminar publicación 🗑️
    </a>
</div>

{% endblock %}
