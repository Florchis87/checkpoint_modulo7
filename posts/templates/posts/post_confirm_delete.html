{% extends 'posts/base.html' %}

{% block content %}

<h1>Eliminar publicación</h1>

<p>
    ¿Estás seguro de que querés eliminar
    <strong>{{ post.titulo }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">Sí, eliminar</button>

    <a href="{% url 'detalle_post' post.id %}">
        Cancelar
    </a>

</form>

{% endblock %}
